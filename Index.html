<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Master — Daily Practice</title>

<style>
/* =========================================================
   MCQ MASTER - COMPLETE SINGLE FILE
   ========================================================= */

:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #687386;
  --border: #e4e8ef;
  --primary: #315efb;
  --primary-dark: #244bd0;
  --success: #16834b;
  --success-bg: #e8f7ef;
  --danger: #d83a52;
  --danger-bg: #fdecef;
  --warning: #b77900;
  --warning-bg: #fff5d9;
  --shadow: 0 8px 30px rgba(20, 35, 70, .08);
  --radius: 16px;
}

[data-theme="dark"] {
  --bg: #10141d;
  --card: #181e29;
  --text: #f2f5fa;
  --muted: #9ba6b8;
  --border: #2b3444;
  --primary: #6d8cff;
  --primary-dark: #5575ed;
  --success: #39c47a;
  --success-bg: #153827;
  --danger: #ff647b;
  --danger-bg: #3a1820;
  --warning: #e6b343;
  --warning-bg: #3a2e12;
  --shadow: 0 8px 30px rgba(0,0,0,.25);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: .2s;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
}

/* ================= HEADER ================= */

.header {
  height: 68px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.logo {
  font-size: 21px;
  font-weight: 800;
}

.logo span {
  color: var(--primary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 12px;
  font-size: 18px;
}

/* ================= LAYOUT ================= */

.layout {
  display: flex;
  min-height: calc(100vh - 68px);
}

.sidebar {
  width: 230px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 20px 12px;
  flex-shrink: 0;
}

.nav-item {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--muted);
  text-align: left;
  padding: 13px 14px;
  border-radius: 11px;
  margin-bottom: 5px;
  font-weight: 600;
}

.nav-item:hover,
.nav-item.active {
  background: rgba(49,94,251,.1);
  color: var(--primary);
}

.main {
  flex: 1;
  padding: 28px;
  max-width: 1400px;
  margin: auto;
  width: 100%;
}

/* ================= COMMON ================= */

.page-title {
  margin: 0 0 6px;
  font-size: 28px;
}

.page-subtitle {
  color: var(--muted);
  margin: 0 0 24px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card-pad {
  padding: 22px;
}

.grid {
  display: grid;
  gap: 18px;
}

.grid-4 {
  grid-template-columns: repeat(4, 1fr);
}

.grid-3 {
  grid-template-columns: repeat(3, 1fr);
}

.grid-2 {
  grid-template-columns: repeat(2, 1fr);
}

.stat {
  padding: 20px;
}

.stat-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.stat-value {
  font-size: 30px;
  font-weight: 800;
  margin-top: 8px;
}

.btn {
  border: 0;
  border-radius: 11px;
  padding: 11px 17px;
  font-weight: 700;
  transition: .15s;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-dark);
}

.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-warning {
  background: var(--warning);
  color: white;
}

.btn-small {
  padding: 7px 11px;
  font-size: 12px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 12px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--primary);
}

textarea {
  min-height: 160px;
  resize: vertical;
}

.form-group {
  margin-bottom: 16px;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

.badge-blue {
  background: rgba(49,94,251,.12);
  color: var(--primary);
}

.badge-green {
  background: var(--success-bg);
  color: var(--success);
}

.badge-red {
  background: var(--danger-bg);
  color: var(--danger);
}

.badge-yellow {
  background: var(--warning-bg);
  color: var(--warning);
}

/* ================= DASHBOARD ================= */

.quick-start {
  padding: 26px;
  margin-bottom: 20px;
}

.quick-start h2 {
  margin-top: 0;
}

.quiz-settings {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 18px;
}

/* ================= QUESTION BANK ================= */

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.question-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.question-row {
  padding: 17px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--card);
}

.question-row-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.question-text {
  font-weight: 700;
  line-height: 1.5;
}

.question-meta {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* ================= IMPORT ================= */

.import-help {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 18px;
}

.import-help pre {
  white-space: pre-wrap;
  font-size: 12px;
  line-height: 1.6;
  margin: 10px 0 0;
}

.import-result {
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  display: none;
}

/* ================= QUIZ ================= */

.quiz-container {
  max-width: 850px;
  margin: auto;
}

.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.progress-wrap {
  height: 8px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 22px;
}

.progress-bar {
  height: 100%;
  background: var(--primary);
  width: 0%;
  transition: width .25s;
}

.question-card {
  padding: 26px;
}

.question-number {
  color: var(--primary);
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 12px;
}

.quiz-question {
  font-size: 21px;
  line-height: 1.5;
  font-weight: 800;
  margin-bottom: 22px;
}

.option {
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.option:hover {
  border-color: var(--primary);
}

.option.selected {
  border-color: var(--primary);
  background: rgba(49,94,251,.1);
}

.option.correct {
  border-color: var(--success);
  background: var(--success-bg);
}

.option.wrong {
  border-color: var(--danger);
  background: var(--danger-bg);
}

.option-letter {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-weight: 800;
  flex-shrink: 0;
}

.answer-input {
  margin: 10px 0 15px;
}

.feedback {
  padding: 15px;
  border-radius: 12px;
  margin-top: 16px;
  display: none;
}

.feedback.correct {
  background: var(--success-bg);
  color: var(--success);
}

.feedback.wrong {
  background: var(--danger-bg);
  color: var(--danger);
}

.explanation {
  margin-top: 8px;
  color: var(--muted);
}

.quiz-actions {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 22px;
}

/* ================= RESULTS ================= */

.result-card {
  text-align: center;
  padding: 35px;
}

.score-circle {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 10px solid var(--primary);
  display: grid;
  place-items: center;
  margin: 15px auto 22px;
  font-size: 27px;
  font-weight: 900;
}

.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 22px 0;
}

.result-stat {
  padding: 16px;
  background: var(--bg);
  border-radius: 12px;
}

.result-stat strong {
  display: block;
  font-size: 23px;
}

/* ================= MODAL ================= */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: var(--card);
  color: var(--text);
  width: min(700px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 18px;
  padding: 24px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

/* ================= EMPTY ================= */

.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

/* ================= MOBILE ================= */

.mobile-nav {
  display: none;
}

@media (max-width: 950px) {
  .grid-4 {
    grid-template-columns: repeat(2, 1fr);
  }

  .quiz-settings {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 700px) {
  .header {
    padding: 0 15px;
  }

  .sidebar {
    display: none;
  }

  .main {
    padding: 18px 14px 80px;
  }

  .grid-4,
  .grid-3,
  .grid-2,
  .quiz-settings {
    grid-template-columns: 1fr;
  }

  .mobile-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 80;
  }

  .mobile-nav button {
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 13px 4px;
    font-size: 11px;
  }

  .mobile-nav button.active {
    color: var(--primary);
  }

  .page-title {
    font-size: 23px;
  }

  .question-card {
    padding: 19px;
  }

  .quiz-question {
    font-size: 18px;
  }

  .result-stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">MCQ <span>Master</span></div>

  <div class="header-right">
    <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </div>
</header>

<div class="layout">

<aside class="sidebar">

  <button class="nav-item active" data-page="dashboard">
    🏠 Dashboard
  </button>

  <button class="nav-item" data-page="quiz">
    🎯 Daily Quiz
  </button>

  <button class="nav-item" data-page="bank">
    📚 Question Bank
  </button>

  <button class="nav-item" data-page="import">
    📥 Bulk Import
  </button>

  <button class="nav-item" data-page="manage">
    ⚙️ Manage Data
  </button>

</aside>

<main class="main" id="app"></main>

</div>

<nav class="mobile-nav">
  <button data-page="dashboard">🏠<br>Home</button>
  <button data-page="quiz">🎯<br>Quiz</button>
  <button data-page="bank">📚<br>Bank</button>
  <button data-page="import">📥<br>Import</button>
</nav>

</div>


<!-- =========================================================
     QUESTION MODAL
========================================================= -->

<div class="modal" id="questionModal">

<div class="modal-box">

  <div class="modal-header">
    <h2 id="modalTitle">Add Question</h2>
    <button class="icon-btn" onclick="closeModal()">✕</button>
  </div>

  <input type="hidden" id="editId">

  <div class="form-group">
    <label>Question</label>
    <textarea id="qText" placeholder="Enter your question..."></textarea>
  </div>

  <div class="grid grid-2">

    <div class="form-group">
      <label>Subject</label>
      <input id="qSubject" placeholder="e.g. Pakistan Studies">
    </div>

    <div class="form-group">
      <label>Difficulty</label>
      <select id="qDifficulty">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
      </select>
    </div>

  </div>

  <div class="form-group">
    <label>Options</label>

    <input id="optA" placeholder="Option A" style="margin-bottom:8px">
    <input id="optB" placeholder="Option B" style="margin-bottom:8px">
    <input id="optC" placeholder="Option C" style="margin-bottom:8px">
    <input id="optD" placeholder="Option D">
  </div>

  <div class="form-group">
    <label>Correct Answer</label>
    <input id="qAnswer" placeholder="For MCQ: A/B/C/D or answer text">
  </div>

  <div class="form-group">
    <label>Explanation (optional)</label>
    <textarea id="qExplanation" placeholder="Short explanation..."></textarea>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="saveQuestionFromModal()">
      Save Question
    </button>

    <button class="btn btn-secondary" onclick="closeModal()">
      Cancel
    </button>
  </div>

</div>
</div>


<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "mcq_master_v1";

let DATA = {
  theme: "light",
  questions: [],
  quizHistory: [],
  todayQuiz: null
};


/* =========================================================
   HELPERS
========================================================= */

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function escapeHTML(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function todayKey() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function normalizeAnswer(answer) {
  return String(answer ?? "")
    .trim()
    .toLowerCase()
    .replace(/^[a-d][\)\.\-:\s]+/i, "")
    .replace(/\s+/g, " ");
}

function shuffle(arr) {
  const a = [...arr];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
    return true;
  } catch (e) {
    console.warn("Local storage unavailable:", e);
    return false;
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
      return false;
    }

    const parsed = JSON.parse(raw);

    DATA = {
      theme: parsed.theme || "light",
      questions: Array.isArray(parsed.questions)
        ? parsed.questions
        : [],
      quizHistory: Array.isArray(parsed.quizHistory)
        ? parsed.quizHistory
        : [],
      todayQuiz: parsed.todayQuiz || null
    };

    return true;

  } catch (e) {
    console.warn("Could not load saved data:", e);

    DATA = {
      theme: "light",
      questions: [],
      quizHistory: [],
      todayQuiz: null
    };

    return false;
  }
}

/* =========================================================
   SAMPLE QUESTIONS
========================================================= */

function seedData() {

  const samples = [

    {
      question: "Bogra Formula was presented in which year?",
      options: ["1951", "1952", "1953", "1954"],
      answer: "1953",
      subject: "Pakistan Studies",
      difficulty: "Easy",
      explanation: ""
    },

    {
      question: "Who assisted Quaid-e-Azam in preparing the 14 Points?",
      options: [
        "Muhammad Ali Jauhar",
        "Allama Iqbal",
        "Liaquat Ali Khan",
        "Sir Syed Ahmad Khan"
      ],
      answer: "Muhammad Ali Jauhar",
      subject: "Pakistan Studies",
      difficulty: "Medium",
      explanation: ""
    },

    {
      question: "The Diarchy system was introduced in the Indian Subcontinent in which year?",
      options: ["1909", "1919", "1929", "1935"],
      answer: "1919",
      subject: "Pakistan Studies",
      difficulty: "Easy",
      explanation: ""
    },

    {
      question: "Sir Syed Ahmad Khan became a member of the Legislative Council in:",
      options: ["1876", "1877", "1878", "1880"],
      answer: "1878",
      subject: "Pakistan Studies",
      difficulty: "Medium",
      explanation: ""
    },

    {
      question: "Pakistan became independent in which year?",
      options: [],
      answer: "1947",
      subject: "Pakistan Studies",
      difficulty: "Easy",
      explanation: ""
    }

  ];

  return {
    theme: "light",
    questions: samples.map(q => ({
      ...q,
      id: uid(),
      createdAt: Date.now()
    })),
    quizHistory: [],
    todayQuiz: null
  };
}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(page) {

  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });

  document.querySelectorAll(".mobile-nav button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });

  if (page === "dashboard") renderDashboard();
  if (page === "quiz") startQuizPage();
  if (page === "bank") renderBank();
  if (page === "import") renderImport();
  if (page === "manage") renderManage();
}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

  const total = DATA.questions.length;

  const subjects = new Set(
    DATA.questions.map(q => q.subject || "General")
  ).size;

  const history = DATA.quizHistory || [];

  const avg = history.length
    ? Math.round(
        history.reduce((sum, x) => sum + x.percentage, 0) /
        history.length
      )
    : 0;

  document.getElementById("app").innerHTML = `

    <h1 class="page-title">Dashboard</h1>

    <p class="page-subtitle">
      Practice smarter with your personal MCQ question bank.
    </p>

    <div class="card quick-start">

      <h2>🎯 Start Today's Practice</h2>

      <p style="color:var(--muted)">
        Create a new quiz from your question bank.
        The quiz can contain questions with options and questions without options.
      </p>

      <div class="quiz-settings">

        <div>
          <label>Subject</label>

          <select id="dashSubject">
            <option value="all">All Subjects</option>
            ${getSubjectOptions()}
          </select>
        </div>

        <div>
          <label>Difficulty</label>

          <select id="dashDifficulty">
            <option value="all">All Levels</option>
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
          </select>
        </div>

        <div>
          <label>Questions</label>

          <select id="dashCount">
            <option value="100">100 Questions</option>
            <option value="50">50 Questions</option>
            <option value="30">30 Questions</option>
            <option value="20">20 Questions</option>
            <option value="10">10 Questions</option>
          </select>
        </div>

        <div style="display:flex;align-items:end">

          <button
            class="btn btn-primary"
            style="width:100%"
            onclick="createQuizFromDashboard()">
            Start Quiz
          </button>

        </div>

      </div>

    </div>


    <div class="grid grid-4">

      <div class="card stat">
        <div class="stat-label">TOTAL QUESTIONS</div>
        <div class="stat-value">${total}</div>
      </div>

      <div class="card stat">
        <div class="stat-label">SUBJECTS</div>
        <div class="stat-value">${subjects}</div>
      </div>

      <div class="card stat">
        <div class="stat-label">QUIZZES COMPLETED</div>
        <div class="stat-value">${history.length}</div>
      </div>

      <div class="card stat">
        <div class="stat-label">AVERAGE SCORE</div>
        <div class="stat-value">${avg}%</div>
      </div>

    </div>


    <div style="margin-top:20px" class="card card-pad"
