<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    color: #222;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 15px;
}

.header {
    background: #222;
    color: white;
    padding: 22px 15px;
    text-align: center;
    border-radius: 14px;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 7px 0 0;
    opacity: 0.8;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

.btn {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 9px;
    background: #222;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 18px;
}

.btn:hover {
    opacity: 0.9;
}

.hidden {
    display: none;
}

.info {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.info-box {
    flex: 1;
    background: white;
    padding: 12px 5px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
}

.timer {
    color: #d00000;
}

.question-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
}

.question-number {
    color: #666;
    font-size: 14px;
    margin-bottom: 10px;
}

.question {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
    margin-bottom: 20px;
}

.option {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 2px solid #ddd;
    border-radius: 9px;
    background: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.option.correct {
    background: #d9f7d5;
    border-color: green;
}

.option.wrong {
    background: #ffdada;
    border-color: red;
}

.option:disabled {
    cursor: default;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.next-btn {
    flex: 1;
    border: none;
    padding: 13px;
    border-radius: 8px;
    background: #222;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

.explanation-btn {
    border: none;
    padding: 13px;
    border-radius: 8px;
    background: #e9ecef;
    font-size: 15px;
}

.explanation {
    display: none;
    background: #f1f3f5;
    padding: 13px;
    margin-top: 12px;
    border-radius: 8px;
    line-height: 1.5;
}

.result {
    text-align: center;
}

.final-score {
    font-size: 40px;
    font-weight: bold;
    margin: 15px 0;
}

.back-btn {
    background: #666;
}

@media (max-width: 500px) {
    .question {
        font-size: 18px;
    }

    .info-box {
        font-size: 12px;
    }
}
</style>
</head>

<div class="container">

    <div class="header">

    <!-- =========================
         HOME / SELECTION SCREEN
         ========================= -->

    <div id="home">

        <div class="card">

                <option value="Islamiat">📙 Islamiat</option>
                <option value="General Science">🔬 General Science</option>
                <option value="Computer">💻 Computer</option>
            </select>


            <label>Topic</label>

            <select id="topicSelect">
                <option value="">-- Select Topic --</option>
            </select>


            <label>Number of Questions</label>

            <select id="questionCount">
                <option value="30">30 Questions</option>
                <option value="60">60 Questions</option>
                <option value="100" selected>100 Questions</option>
            </select>


            <label>Time</label>

            <select id="timeLimit">
                <option value="20">20 Minutes</option>
                <option value="40">40 Minutes</option>
                <option value="60" selected>60 Minutes</option>
            </select>


            <button class="btn" onclick="startQuiz()">
                🚀 Start Quiz
            </button>

        </div>

    </div>


    <!-- =========================
         QUIZ SCREEN
         ========================= -->

    <div id="quiz" class="hidden">

        <div class="info">

            <div class="info-box">
                Question
                <br>
                <span id="progress">1/10</span>
            </div>

            <div class="info-box">
                Score
                <br>
                <span id="score">0</span>
            </div>

            <div class="info-box timer">
                Time

            </div>

        </div>


        <div class="question-box">

            <div class="question-number" id="questionNumber">
                Question 1
            </div>

            <div class="question" id="question">
                Question
            </div>

            <div id="options"></div>


            <div class="buttons">

                    onclick="toggleExplanation()">
                    ℹ Explanation
                </button>

                <button
                    class="next-btn"
                    onclick="nextQuestion()">
                    Next →
                </button>

            </div>


            <div
                class="explanation"
                id="explanation">
            </div>

        </div>

    </div>


    <!-- =========================
         RESULT SCREEN
         ========================= -->

    <div id="result" class="card result hidden">

        <h2>🎉 Test Completed!</h2>

        <div
            class="final-score"
            id="finalScore">
            0 / 0
        </div>

        <p id="percentage">
            Percentage: 0%
        </p>

        <p id="resultMessage"></p>

        <button
            class="btn"
            onclick="location.reload()">
            🔄 Retry
        </button>

        <button
            class="btn back-btn"
            onclick="goHome()">
            🏠 Home
        </button>

    </div>

</div>

/* ============================================================
   QUIZ VARIABLES
   ============================================================ */

let quizQuestions = [];

let currentQuestion = 0;

let userScore = 0;

let answered = false;

let timerInterval;

let timeRemaining = 0;


/* ============================================================
   LOAD TOPICS
   ============================================================ */

function loadTopics() {

    const subject =
        document.getElementById("subjectSelect").value;

    const topicSelect =
        document.getElementById("topicSelect");

    topicSelect.innerHTML =
        '<option value="">-- Select Topic --</option>';

    if (!subject) {
        return;
    }

    topics[subject].forEach(topic => {

        const option =
            document.createElement("option");

        option.value = topic;

        option.textContent = topic;

        topicSelect.appendChild(option);

    });

}


/* ============================================================
   START QUIZ
   ============================================================ */

function startQuiz() {

    const subject =
        document.getElementById("subjectSelect").value;

    const topic =
        document.getElementById("topicSelect").value;

    let count =
        parseInt(
            document.getElementById("questionCount").value
        );

    const minutes =
        parseInt(
            document.getElementById("timeLimit").value
        );


    if (!subject) {

        alert("Please select a subject.");

        return;
    }


    if (!topic) {

        alert("Please select a topic.");

        return;
    }


    /* Filter MCQs according to Subject + Topic */

    quizQuestions =
        questions.filter(q =>
            q.subject === subject &&
            q.topic === topic
        );


    if (quizQuestions.length === 0) {

        alert(
            "No MCQs available for this topic yet."
        );

        return;
    }


    /* If topic has fewer questions */

    if (count > quizQuestions.length) {

        count = quizQuestions.length;

    }


    /* Random questions */

    quizQuestions =
        [...quizQuestions]
        .sort(() => Math.random() - 0.5)
        .slice(0, count);


    currentQuestion = 0;

    userScore = 0;

    timeRemaining = minutes * 60;


    document
        .getElementById("home")
        .classList.add("hidden");


    document
        .getElementById("quiz")
        .classList.remove("hidden");


    document
        .getElementById("score")
        .textContent = "0";


    startTimer();

    showQuestion();

}


/* ============================================================
   SHOW QUESTION
   ============================================================ */

function showQuestion() {

    answered = false;


    const q =
        quizQuestions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        "Question " + (currentQuestion + 1);


    document
        .getElementById("progress")
        .textContent =
        (currentQuestion + 1) +
        "/" +
        quizQuestions.length;


    document
        .getElementById("question")
        .textContent =
        q.question;


    const explanation =
        document.getElementById("explanation");


    explanation.style.display = "none";


    explanation.textContent =
        q.explanation ||
        "No explanation available.";


    const options =
        document.getElementById("options");


    options.innerHTML = "";


    q.options.forEach((option, index) => {

        const button =
            document.createElement("button");


        button.className = "option";


        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;


        button.onclick = function() {

            selectAnswer(index);

        };


        options.appendChild(button);

    });

}


/* ============================================================
   SELECT ANSWER
   ============================================================ */

function selectAnswer(selectedIndex) {

    if (answered) return;


    answered = true;


    const q =
        quizQuestions[currentQuestion];


    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach((button, index) => {

        button.disabled = true;


        if (index === q.answer) {

            button.classList.add("correct");

        }


        if (
            index === selectedIndex &&
            selectedIndex !== q.answer
        ) {

            button.classList.add("wrong");

        }

    });


    if (selectedIndex === q.answer) {

        userScore++;


        document
            .getElementById("score")
            .textContent =
            userScore;

    }

}


/* ============================================================
   EXPLANATION
   ============================================================ */

function toggleExplanation() {

    const explanation =
        document.getElementById("explanation");


    if (
        explanation.style.display === "block"
    ) {

        explanation.style.display = "none";

    } else {

        explanation.style.display = "block";

    }

}


/* ============================================================
   NEXT QUESTION
   ============================================================ */

function nextQuestion() {

    if (!answered) {

        alert(
            "Please select an answer first."
        );

        return;
    }


    currentQuestion++;


    if (
        currentQuestion >=
        quizQuestions.length
    ) {

        finishQuiz();

        return;

    }


    showQuestion();

}


/* ============================================================
   TIMER
   ============================================================ */

function startTimer() {

    clearInterval(timerInterval);


    updateTimer();


    timerInterval =
        setInterval(() => {

            timeRemaining--;


            updateTimer();


            if (timeRemaining <= 0) {

                clearInterval(timerInterval);

                finishQuiz();

            }

        }, 1000);

}


function updateTimer() {

    let minutes =
        Math.floor(timeRemaining / 60);


    let seconds =
        timeRemaining % 60;


    minutes =
        String(minutes).padStart(2, "0");


    seconds =
        String(seconds).padStart(2, "0");


    document
        .getElementById("timer")
        .textContent =
        minutes + ":" + seconds;

}


/* ============================================================
   FINISH QUIZ
   ============================================================ */

function finishQuiz() {

    clearInterval(timerInterval);


    document
        .getElementById("quiz")
        .classList.add("hidden");


    document
        .getElementById("result")
        .classList.remove("hidden");


    const total =
        quizQuestions.length;


    const percentage =
        Math.round(
            (userScore / total) * 100
        );


    document
        .getElementById("finalScore")
        .textContent =
        userScore + " / " + total;


    document
        .getElementById("percentage")
        .textContent =
        "Percentage: " +
        percentage +
        "%";


    let message;


    if (percentage >= 80) {

        message =
            "Excellent! 🔥 Keep it up.";

    } else if (percentage >= 60) {

        message =
            "Good job! 👍 Keep practicing.";

    } else {

        message =
            "Keep practicing. 💪 You can improve.";

    }


    document
        .getElementById("resultMessage")
        .textContent =
        message;

}


/* ============================================================
   HOME
   ============================================================ */

function goHome() {

    clearInterval(timerInterval);

    location.reload();

}
